services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 only when Postgres is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval:     10s
      timeout:       5s
      retries:       5
      start_period: 10s
    restart: unless-stopped
    networks:
      - llmetry

  # ─── NestJS Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context:    .
      dockerfile: Dockerfile
      # Name the target explicitly so Docker can skip stages it doesn't need
      target: final
    ports:
      # HOST_PORT lets you remap the exposed port without editing this file.
      # Default: 5000 → 5000
      - "${HOST_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT:     5000
      DB_HOST:  postgres
      DB_PORT:       ${DB_PORT}
      DB_NAME:       ${DB_NAME}
      DB_USERNAME:   ${DB_USERNAME}
      DB_PASSWORD:   ${DB_PASSWORD}
      JWT_SECRET:    ${JWT_SECRET}
      TOKEN_SECRET:  ${TOKEN_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        # Backend won't start until postgres passes its health check.
        # The entrypoint then runs migrations before starting the HTTP server.
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Uses Node's built-in http module — no curl/wget required in the image
      test:
        - "CMD-SHELL"
        - >
          node -e "
            require('http').get('http://localhost:5000/', function(r){
              process.exit(r.statusCode < 400 ? 0 : 1)
            }).on('error', function(){ process.exit(1) })
          "
      interval:     30s
      timeout:      10s
      retries:       3
      start_period: 40s
    networks:
      - llmetry

# ─── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    # Docker manages the volume lifecycle; data persists across container
    # restarts and rebuilds.  Remove with: docker compose down -v

# ─── Internal network ──────────────────────────────────────────────────────────
networks:
  llmetry:
    driver: bridge
    # Isolates the stack from other containers on the host
